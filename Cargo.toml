[package]
name = "web_ho_tro_hoc_tap"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = "0.7.9"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.4.13", features = ["util"] }
